name: CI

on:
  push:
    branches:
      - 'main'
    paths-ignore:
      - 'README.md'
      - '.gitignore'
      - '.dockerignore'
      - '.github/**'
  pull_request:
    paths-ignore:
      - 'README.md'
      - '.gitignore'
      - '.dockerignore'
      - '.github/**'

concurrency:
  group: container-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io

permissions:
  contents: read
  id-token: write
  packages: write
  attestations: write

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Normalize image name
        id: image-name
        run: |
          image_name="$(printf '%s' "$GITHUB_REPOSITORY" | tr '[:upper:]' '[:lower:]')"
          echo "name=${image_name}" >> "$GITHUB_OUTPUT"

      - name: Read Caddy version
        id: caddy-version
        run: |
          first_line="$(head -n 1 Dockerfile)"
          if [[ "$first_line" =~ ^FROM[[:space:]]+caddy:([0-9]+\.[0-9]+\.[0-9]+)-builder-alpine[[:space:]]+AS[[:space:]]+builder$ ]]; then
            echo "version=${BASH_REMATCH[1]}" >> "$GITHUB_OUTPUT"
          else
            echo "Could not extract Caddy version from Dockerfile first line: $first_line" >&2
            exit 1
          fi

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate image metadata
        id: metadata
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ steps.image-name.outputs.name }}
          tags: |
            type=ref,event=tag
            type=raw,value=latest,enable={{is_default_branch}}
            type=raw,value=${{ steps.caddy-version.outputs.version }}
            type=sha

      - name: Build candidate image
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: ${{ github.event_name == 'pull_request' && 'linux/amd64' || 'linux/amd64,linux/arm64' }}
          push: ${{ github.event_name == 'push' }}
          load: ${{ github.event_name == 'pull_request' }}
          tags: ${{ env.REGISTRY }}/${{ steps.image-name.outputs.name }}:candidate-${{ github.sha }}
          labels: ${{ steps.metadata.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Verify Cloudflare module
        run: >-
          docker run --rm ${{ env.REGISTRY }}/${{ steps.image-name.outputs.name }}:candidate-${{ github.sha }}
          caddy list-modules --packages | grep -Fx 'dns.providers.cloudflare github.com/caddy-dns/cloudflare'

      - name: Promote verified image
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          IMAGE_DIGEST: ${{ steps.build.outputs.digest }}
          IMAGE_NAME: ${{ steps.image-name.outputs.name }}
          IMAGE_TAGS: ${{ steps.metadata.outputs.tags }}
        run: |
          set -euo pipefail

          while IFS= read -r tag; do
            [[ -n "$tag" ]] || continue
            docker buildx imagetools create \
              --tag "$tag" \
              "${REGISTRY}/${IMAGE_NAME}@${IMAGE_DIGEST}"
          done <<< "$IMAGE_TAGS"

      - name: Attest image provenance
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/attest-build-provenance@v4
        with:
          subject-name: ${{ env.REGISTRY }}/${{ steps.image-name.outputs.name }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true